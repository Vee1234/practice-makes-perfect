name: Maven CI

# Trigger pipeline
on:
  push:
  pull_request:

jobs:
  maven-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean test